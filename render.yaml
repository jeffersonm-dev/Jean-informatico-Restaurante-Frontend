# render.yaml - Versión Node (sin Docker)
services:
  - type: web
    name: jean-informatico-restaurante-frontend
    runtime: node
    repo: https://github.com/jeffersonm-dev/Jean-informatico-Restaurante-Frontend
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port 5173
    healthCheckPath: /
    autoDeploy: true
    
    envVars:
      - key: VITE_API_URL
        value: https://restaurante-api-uam4.onrender.com/api
      - key: VITE_APP_TITLE
        value: Jean Informático Restaurante
      - key: VITE_NODE_ENV
        value: production